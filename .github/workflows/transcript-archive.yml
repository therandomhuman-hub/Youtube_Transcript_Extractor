name: YouTube Transcript Archive

on:
  # Keep long-running collection on the schedule or explicit manual dispatch.
  # Code changes are covered by the short validation workflow.
  schedule:
    # Four runs per day at 00:17, 06:17, 12:17, and 18:17 UTC.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      max_channels:
        description: "Optional test limit (0 = all channels)"
        required: false
        default: "0"
        type: string
      max_items_per_channel:
        description: "Transcript attempts per channel per run (12 default; 0 = unlimited)"
        required: false
        default: "12"
        type: string

permissions:
  contents: write

concurrency:
  group: youtube-transcript-archive
  # Never terminate a collecting run just because another scheduled/manual run arrives.
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Deno runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Configure optional authorized YouTube cookies
        env:
          YOUTUBE_COOKIES_BASE64: ${{ secrets.YOUTUBE_COOKIES_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$YOUTUBE_COOKIES_BASE64" ]; then
            printf '%s' "$YOUTUBE_COOKIES_BASE64" | base64 --decode > "$RUNNER_TEMP/youtube-cookies.txt"
            chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
            echo "YOUTUBE_COOKIES_FILE=$RUNNER_TEMP/youtube-cookies.txt" >> "$GITHUB_ENV"
            echo "Authorized cookie file configured from repository secret."
          else
            echo "No cookie secret configured; YouTube may challenge hosted runners."
          fi
      - name: Run transcript archive
        id: archive
        timeout-minutes: 340
        env:
          MAX_CHANNELS_INPUT: ${{ github.event.inputs.max_channels || '0' }}
          MAX_ITEMS_PER_CHANNEL_INPUT: ${{ github.event.inputs.max_items_per_channel || '12' }}
          USE_WHISPER_FALLBACK: "false"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          if [[ ! "$MAX_CHANNELS_INPUT" =~ ^[0-9]+$ ]]; then
            echo "max_channels must be a non-negative integer."
            exit 2
          fi
          if [[ ! "$MAX_ITEMS_PER_CHANNEL_INPUT" =~ ^[0-9]+$ ]]; then
            echo "max_items_per_channel must be a non-negative integer."
            exit 2
          fi
          python multi_channel_runner.py --max-channels "$MAX_CHANNELS_INPUT" --max-items-per-channel "$MAX_ITEMS_PER_CHANNEL_INPUT"
      - name: Finalize run report
        if: always()
        env:
          ARCHIVE_STEP_OUTCOME: ${{ steps.archive.outcome }}
        run: python scripts/finalize_run_report.py --status "$ARCHIVE_STEP_OUTCOME"
      - name: Package completed channel archives
        if: always()
        run: python scripts/package_completed.py --root .
      - name: Upload run report and channel state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-archive-report-${{ github.run_id }}
          path: |
            last_run_report.json
            last_run_report.md
            channel_state.json
            **/collection_summary.txt
            completed/*.zip
          if-no-files-found: warn
          retention-days: 14
      - name: Commit transcript and state changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels.txt channel_state.json last_run_report.json last_run_report.md completed updated
          if [ -f .youtube_rate_limit_state.json ]; then git add .youtube_rate_limit_state.json; fi
          find . -mindepth 2 -maxdepth 2 -name transcript_manifest.json -printf '%h\n' 2>/dev/null | while read folder; do git add "$folder"; done
          git add -u
          if git diff --cached --quiet; then
            echo "No transcript or state changes to commit."
          else
            git commit -m "chore: update scheduled YouTube transcripts [skip ci]"
            # Other workflows or manual commits may advance main while this run is collecting.
            # Rebase onto the latest main before pushing; never force-push over newer work.
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::Could not rebase archive changes onto latest main. Preserving remote history; inspect conflicts."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed; refreshing main and retrying."
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Unable to publish archive after 3 safe push attempts."
              exit 1
            fi
          fi
