name: YouTube Transcript Archive

on:
  schedule:
    # Runs every six hours; GitHub cron uses UTC.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      max_channels:
        description: "Optional test limit (0 = all channels)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: youtube-transcript-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Deno runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run transcript archive
        env:
          USE_WHISPER_FALLBACK: "false"
          PYTHONUNBUFFERED: "1"
        run: |
          MAX_CHANNELS="${{ github.event.inputs.max_channels || '0' }}"
          python multi_channel_runner.py --max-channels "$MAX_CHANNELS"
      - name: Commit transcript and state changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels.txt channel_state.json last_run_report.json .youtube_rate_limit_state.json completed updated || true
          find . -mindepth 2 -maxdepth 2 -name transcript_manifest.json -printf '%h\n' 2>/dev/null | while read folder; do git add "$folder"; done
          git add -u
          if git diff --cached --quiet; then
            echo "No transcript or state changes to commit."
          else
            git commit -m "chore: update scheduled YouTube transcripts [skip ci]"
            git push
          fi
