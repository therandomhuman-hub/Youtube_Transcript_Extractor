name: YouTube Transcript Archive

on:
  push:
    paths:
      - "multi_channel_runner.py"
      - "youtube_channel_transcripts.py"
      - ".github/workflows/transcript-archive.yml"
      - "scripts/finalize_run_report.py"
  schedule:
    # Runs every six hours; GitHub cron uses UTC.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      max_channels:
        description: "Optional test limit (0 = all channels)"
        required: false
        default: "0"
        type: string
      max_items_per_channel:
        description: "Transcript attempts per channel per run (6 recommended; 0 = unlimited)"
        required: false
        default: "6"
        type: string

permissions:
  contents: write

concurrency:
  group: youtube-transcript-archive
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Deno runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Configure optional authorized YouTube cookies
        env:
          YOUTUBE_COOKIES_BASE64: ${{ secrets.YOUTUBE_COOKIES_BASE64 }}
        shell: bash
        run: |
          if [ -n "$YOUTUBE_COOKIES_BASE64" ]; then
            printf '%s' "$YOUTUBE_COOKIES_BASE64" | base64 --decode > "$RUNNER_TEMP/youtube-cookies.txt"
            chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
            echo "YOUTUBE_COOKIES_FILE=$RUNNER_TEMP/youtube-cookies.txt" >> "$GITHUB_ENV"
            echo "Authorized cookie file configured from repository secret."
          else
            echo "No cookie secret configured; YouTube may challenge hosted runners."
          fi
      - name: Run transcript archive
        id: archive
        timeout-minutes: 300
        env:
          MAX_CHANNELS_INPUT: ${{ github.event.inputs.max_channels || '0' }}
          MAX_ITEMS_PER_CHANNEL_INPUT: ${{ github.event.inputs.max_items_per_channel || '6' }}
          USE_WHISPER_FALLBACK: "false"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          if [[ ! "$MAX_CHANNELS_INPUT" =~ ^[0-9]+$ ]]; then
            echo "max_channels must be a non-negative integer."
            exit 2
          fi
          if [[ ! "$MAX_ITEMS_PER_CHANNEL_INPUT" =~ ^[0-9]+$ ]]; then
            echo "max_items_per_channel must be a non-negative integer."
            exit 2
          fi
          python multi_channel_runner.py --max-channels "$MAX_CHANNELS_INPUT" --max-items-per-channel "$MAX_ITEMS_PER_CHANNEL_INPUT"
      - name: Finalize report and package completed channel archives
        if: always()
        env:
          ARCHIVE_STEP_OUTCOME: ${{ steps.archive.outcome }}
        shell: bash
        run: |
          python scripts/finalize_run_report.py --status "$ARCHIVE_STEP_OUTCOME" || true
          python scripts/package_completed.py --root .
      - name: Upload run report and channel state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-archive-report-${{ github.run_id }}
          path: |
            last_run_report.json
            channel_state.json
            **/collection_summary.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Commit transcript and state changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels.txt channel_state.json last_run_report.json completed updated
          if [ -f .youtube_rate_limit_state.json ]; then git add .youtube_rate_limit_state.json; fi
          find . -mindepth 2 -maxdepth 2 -name transcript_manifest.json -printf '%h\n' 2>/dev/null | while read folder; do git add "$folder"; done
          git add -u
          if git diff --cached --quiet; then
            echo "No transcript or state changes to commit."
          else
            git commit -m "chore: update scheduled YouTube transcripts [skip ci]"
            git push
          fi
