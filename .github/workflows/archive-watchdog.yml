name: YouTube Archive Schedule Watchdog

on:
  # Runs between the archive's four main schedule slots and recovers missed triggers.
  schedule:
    # Retry the health check twice per hour if a hosted runner fails to start.
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: youtube-archive-watchdog
  cancel-in-progress: false

jobs:
  recover-missed-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch archive if scheduled run is overdue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflowId = "transcript-archive.yml";
            const thresholdHours = 5;
            const activeStatuses = new Set([
              "queued", "in_progress", "requested", "waiting", "pending"
            ]);

            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              per_page: 10
            });
            const runs = response.data.workflow_runs || [];

            const active = runs.find(run => activeStatuses.has(run.status));
            if (active) {
              core.info(
                `Archive workflow already active: run ${active.run_number} (${active.status}); no duplicate dispatch.`
              );
              return;
            }

            const latest = runs
              .slice()
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

            if (latest) {
              const ageHours = (Date.now() - new Date(latest.created_at).getTime()) / 3600000;
              core.info(`Latest archive run: #${latest.run_number}, age ${ageHours.toFixed(2)} hours.`);
              if (ageHours < thresholdHours) {
                core.info(`Archive is not overdue (threshold ${thresholdHours} hours).`);
                return;
              }
            } else {
              core.warning("No archive run found; dispatching the first recovery run.");
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: workflowId,
              ref: "main",
              inputs: {
                max_channels: "0",
                max_items_per_channel: "0",
                channel_workers: "3"
              }
            });
            core.notice(
              `Dispatched archive recovery after ${thresholdHours} hours without a newer run.`
            );
