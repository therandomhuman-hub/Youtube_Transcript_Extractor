name: Isaacverse Live Transcript Test

on:
  push:
    branches: [main]
    paths:
      - live-test.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isaacverse-live-transcript-test
  cancel-in-progress: false

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Deno runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Confirm the isolated target
        shell: bash
        run: |
          test "$(grep -Ev '^[[:space:]]*(#|$)' live-test.txt | wc -l | tr -d ' ')" = "1"
          grep -F 'https://www.youtube.com/@isaacverse' live-test.txt
      - name: Configure optional authorized YouTube cookies
        env:
          YOUTUBE_COOKIES_BASE64: ${{ secrets.YOUTUBE_COOKIES_BASE64 }}
        shell: bash
        run: |
          if [ -n "$YOUTUBE_COOKIES_BASE64" ]; then
            printf '%s' "$YOUTUBE_COOKIES_BASE64" | base64 --decode > "$RUNNER_TEMP/youtube-cookies.txt"
            chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
            echo "YOUTUBE_COOKIES_FILE=$RUNNER_TEMP/youtube-cookies.txt" >> "$GITHUB_ENV"
            echo "Authorized cookie file configured from repository secret."
          else
            echo "No cookie secret configured; live transcript extraction may be challenged."
          fi
      - name: Run live discovery and transcript extraction
        timeout-minutes: 300
        env:
          USE_WHISPER_FALLBACK: "false"
          PYTHONUNBUFFERED: "1"
        run: python multi_channel_runner.py --channels-file live-test.txt --output-dir live_test_output --max-channels 1
      - name: Generate per-video audit report
        if: always()
        run: |
          if [ -f live_test_output/last_run_report.json ]; then
            python scripts/verify_live_test.py --report live_test_output/last_run_report.json --expected-videos 9 --output live_test_output/ISAACVERSE_LIVE_TEST_AUDIT.md | tee -a "$GITHUB_STEP_SUMMARY"
            cat live_test_output/ISAACVERSE_LIVE_TEST_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No runner report was generated; extraction may have failed before channel processing.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce live transcript test acceptance criteria
        if: always()
        shell: bash
        run: |
          if [ ! -f live_test_output/last_run_report.json ]; then
            echo "FAIL: no live-run report exists."
            exit 1
          fi
          python - <<'PY'
          import json, sys
          payload = json.load(open("live_test_output/last_run_report.json", encoding="utf-8"))
          rows = payload.get("results") or []
          row = next((x for x in rows if "isaacverse" in str(x.get("channel_url", "")).lower()), rows[0] if rows else {})
          expected = 9
          actual = int(row.get("video_count", 0))
          known = int(row.get("known_items", 0))
          saved = int(row.get("saved_total", 0))
          unresolved = int(row.get("unresolved_items", max(0, known - saved)))
          status = row.get("status")
          print(f"Expected regular videos: {expected}; actual: {actual}")
          print(f"Transcript coverage: {saved}/{known}; unresolved: {unresolved}; status: {status}")
          if actual != expected or status != "COMPLETED" or saved != known or unresolved != 0 or row.get("scan_errors"):
              print("FAIL: live test did not meet production acceptance criteria; inspect the generated audit artifact.")
              sys.exit(1)
          print("PASS: exact channel count and all transcripts saved.")
          PY
      - name: Upload live test transcripts and audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: isaacverse-live-test-results
          path: live_test_output/
          if-no-files-found: warn
          retention-days: 14
